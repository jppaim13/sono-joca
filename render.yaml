# Blueprint do Render: cria o banco e o serviço web a partir deste repositório.
# Planos: starter (web, não hiberna) e basic-256mb (Postgres com backup).
# Para testar de graça, troque ambos por "free" (o web hiberna e o banco free expira).
databases:
  - name: sono-joaquim-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    databaseName: sono
    user: sono

services:
  - type: web
    name: sono-joaquim
    runtime: python
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sono-joaquim-db
          property: connectionString
